name: Release PhotoStudio update package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.2.0"
        required: true
        default: "1.0.2.0"
      release_notes:
        description: "Release notes"
        required: false
        default: "PhotoStudio update"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout updater repository
        uses: actions/checkout@v4
        with:
          path: updater-repo

      - name: Checkout PhotoStudio source
        uses: actions/checkout@v4
        with:
          repository: kimothink/PhotoStudio
          path: source

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build update package
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $packageUrl = "https://github.com/kimothink/PhotoStudioUpdater/releases/download/v$version/PhotoStudio.update.zip"
          .\source\scripts\Build-PhotoStudioRelease.ps1 -Version $version -PackageUrl $packageUrl

      - name: Update manifest in repository
        shell: pwsh
        run: |
          Copy-Item .\source\artifacts\updater\manifest.json .\updater-repo\manifest.json -Force
          Push-Location .\updater-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update manifest for ${{ inputs.version }}" || Write-Host "No manifest changes"
          git push
          Pop-Location

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: PhotoStudio update ${{ inputs.version }}
          body: ${{ inputs.release_notes }}
          files: |
            source/artifacts/updater/PhotoStudio.update.zip
            source/artifacts/updater/manifest.json
